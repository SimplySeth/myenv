---
- name: Check if Homebrew is already installed
  ansible.builtin.stat:
    path: "{{ '/opt/homebrew/bin/brew' if ansible_architecture == 'arm64' else '/usr/local/bin/brew' }}"
  register: homebrew_check

- name: Download and run the official Homebrew installer script
  ansible.builtin.shell: |
    NONINTERACTIVE={{ '1' if homebrew_install_noninteractive else '0' }} \
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not homebrew_check.stat.exists
  register: homebrew_install_result
  changed_when: homebrew_install_result.rc == 0
  args:
    executable: /bin/bash

- name: Ensure Homebrew environment is configured in shell profile (Apple Silicon)
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zprofile"
    line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
    create: true
    mode: '0644'
  when: ansible_architecture == 'arm64'

- name: Ensure Homebrew environment is configured in shell profile (Intel)
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zprofile"
    line: 'eval "$(/usr/local/bin/brew shellenv)"'
    create: true
    mode: '0644'
  when: ansible_architecture == 'x86_64'

- name: Verify Homebrew installation
  ansible.builtin.command: "{{ '/opt/homebrew/bin/brew' if ansible_architecture == 'arm64' else '/usr/local/bin/brew' }} --version"
  register: homebrew_version
  changed_when: false

- name: Display Homebrew version
  ansible.builtin.debug:
    msg: "{{ homebrew_version.stdout_lines[0] }}"

- name: Install chezmois
  community.general.homebrew:
    name: chezmoi
    state: present
...
