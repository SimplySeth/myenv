---
- name: Ensure vim and git are installed
  ansible.builtin.command: which {{ item }}
  loop:
    - vim
    - git
  register: macos_vundle_install_prerequisite_check
  changed_when: false
  failed_when: macos_vundle_install_prerequisite_check.rc != 0

- name: Create ~/.vim/bundle directory if it does not exist
  ansible.builtin.file:
    path: "{{ macos_vundle_install_user_home }}/.vim/bundle"
    state: directory
    owner: "{{ macos_vundle_install_user }}"
    mode: '0755'

- name: Clone Vundle repository into ~/.vim/bundle/Vundle.vim
  ansible.builtin.git:
    repo: "{{ macos_vundle_install_repo }}"
    dest: "{{ macos_vundle_install_dest }}"
    version: master
    depth: 1
    update: true
  become: true
  become_user: "{{ macos_vundle_install_user }}"

- name: Check if .vimrc exists
  ansible.builtin.stat:
    path: "{{ macos_vundle_install_user_home }}/.vimrc"
  register: macos_vundle_install_vimrc_stat

- name: Check if .gvimrc exists
  ansible.builtin.stat:
    path: "{{ macos_vundle_install_user_home }}/.gvimrc"
  register: macos_vundle_install_gvimrc_stat

- name: Create initial .vimrc with Vundle boilerplate if missing
  ansible.builtin.template:
    src: files/vimrc.j2
    dest: "{{ macos_vundle_install_user_home }}/.vimrc"
    owner: "{{ macos_vundle_install_user }}"
    mode: '0644'
  when: not macos_vundle_install_vimrc_stat.stat.exists

- name: Create initial .gvimrc
  ansible.builtin.template:
    src: files/vimrc.j2
    dest: "{{ macos_vundle_install_user_home }}/.gvimrc"
    owner: "{{ macos_vundle_install_user }}"
    mode: '0644'
  vars:
    flavor: gvim
  when: not macos_vundle_install_gvimrc_stat.stat.exists

- name: Automatically install or update plugins via Vundle in batch mode
  ansible.builtin.command: vim +PluginInstall +qall
  become: true
  become_user: "{{ macos_vundle_install_user }}"
  when: macos_vundle_install_auto_install_plugins | bool
  changed_when: false
