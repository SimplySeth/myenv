---
# Target user and home directory for Vundle installation
vundle_user: "{{ ansible_user_id }}"
vundle_user_home: "{{ ansible_env.HOME }}"

# Vundle repository URL and destination path
vundle_repo: "https://github.com/VundleVim/Vundle.vim.git"
vundle_dest: "{{ vundle_user_home }}/.vim/bundle/Vundle.vim"

# Whether to automatically run PluginInstall via vim on first setup
vundle_auto_install_plugins: true
