---
- name: Ensure git and neovim are installed
  ansible.builtin.command: which {{ item }}
  loop:
    - git
    - nvim
  register: prerequisite_check
  changed_when: false
  failed_when: prerequisite_check.rc != 0

- name: Ensure parent config directories exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    owner: "{{ nvchad_user }}"
    mode: '0755'
  loop: "{{ nvchad_target_configs }}"

- name: Check if NvChad configuration target already exists
  ansible.builtin.stat:
    path: "{{ item }}"
  register: nvchad_path_stats
  loop: "{{ nvchad_target_configs }}"

- name: Clone NvChad starter repository into target configurations
  ansible.builtin.git:
    repo: "{{ nvchad_repo_url }}"
    dest: "{{ item.item }}"
    depth: 1
    update: false
  become_user: "{{ nvchad_user }}"
  loop: "{{ nvchad_path_stats.results }}"
  when: not item.stat.exists

- name: Ensure correct file ownership for cloned NvChad directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ nvchad_user }}"
  loop: "{{ nvchad_target_configs }}"
