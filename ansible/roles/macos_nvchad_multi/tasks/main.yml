---
- name: Ensure git and neovim are installed
  ansible.builtin.command: which {{ item }}
  loop:
    - git
    - nvim
  register: macos_nvchad_multi_prerequisite_check
  changed_when: false
  failed_when: macos_nvchad_multi_prerequisite_check.rc != 0

- name: Ensure parent config directories exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    owner: "{{ macos_nvchad_multi_user }}"
    mode: '0755'
  loop: "{{ macos_nvchad_multi_target_configs }}"

- name: Check if NvChad configuration target already exists
  ansible.builtin.stat:
    path: "{{ item }}"
  register: macos_nvchad_multi_path_stats
  loop: "{{ macos_nvchad_multi_target_configs }}"

- name: Clone NvChad starter repository into target configurations
  ansible.builtin.git:
    repo: "{{ macos_nvchad_multi_nvchad_repo_url }}"
    dest: "{{ item.item }}"
    version: master
    depth: 1
    update: false
  become: true
  become_user: "{{ macos_nvchad_multi_user }}"
  loop: "{{ macos_nvchad_multi_path_stats.results }}"
  when: not item.stat.exists

- name: Ensure correct file ownership for cloned NvChad directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ macos_nvchad_multi_user }}"
  loop: "{{ macos_nvchad_multi_target_configs }}"
