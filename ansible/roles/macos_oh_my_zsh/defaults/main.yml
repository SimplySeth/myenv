---
# Target user for Oh My Zsh installation
macos_oh_my_zsh_user: "{{ ansible_user_id }}"
macos_oh_my_zsh_user_home: "{{ ansible_env.HOME }}"

# Git repository URL for Oh My Zsh
macos_oh_my_zsh_repo: "https://github.com/ohmyzsh/ohmyzsh.git"
macos_oh_my_zsh_dest: "{{ macos_oh_my_zsh_user_home }}/.oh-my-zsh"

# Theme configuration
macos_oh_my_zsh_theme: "fino-time"

# Plugins configuration
macos_oh_my_zsh_plugins:
  - git
  - zsh-autosuggestions
  - zsh-syntax-highlighting

# Automatically change default shell to zsh if not already set
macos_oh_my_zsh_change_default_shell: true
