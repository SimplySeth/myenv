---
- name: Ensure git and zsh are installed
  ansible.builtin.command: which {{ item }}
  loop:
    - git
    - zsh
  register: macos_oh_my_zsh_prerequisite_check
  changed_when: false
  failed_when: macos_oh_my_zsh_prerequisite_check.rc != 0

- name: Clone Oh My Zsh repository
  ansible.builtin.git:
    repo: "{{ macos_oh_my_zsh_repo }}"
    dest: "{{ macos_oh_my_zsh_dest }}"
    version: "{{ macos_oh_my_zsh_version | default('master') }}"
    depth: 1
    update: false
  become: true
  become_user: "{{ macos_oh_my_zsh_user }}"

- name: Check if .zshrc exists
  ansible.builtin.stat:
    path: "{{ macos_oh_my_zsh_user_home }}/.zshrc"
  register: macos_oh_my_zsh_zshrc_stat

- name: Create default .zshrc from template if missing
  ansible.builtin.copy:
    src: "{{ macos_oh_my_zsh_dest }}/templates/zshrc.zsh-template"
    dest: "{{ macos_oh_my_zsh_user_home }}/.zshrc"
    remote_src: true
    mode: '0644'
    owner: "{{ macos_oh_my_zsh_user }}"
  when: not macos_oh_my_zsh_zshrc_stat.stat.exists

- name: Set ZSH_THEME in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ macos_oh_my_zsh_user_home }}/.zshrc"
    regexp: '^ZSH_THEME='
    line: 'ZSH_THEME="{{ macos_oh_my_zsh_theme }}"'
    backup: true

- name: Set plugins in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ macos_oh_my_zsh_user_home }}/.zshrc"
    regexp: '^plugins=\('
    line: "plugins=({{ macos_oh_my_zsh_plugins | join(' ') }})"

- name: Get current default shell for target user
  ansible.builtin.command: dscl . -read /Users/{{ macos_oh_my_zsh_user }} UserShell
  register: macos_oh_my_zsh_current_user_shell
  changed_when: false
  failed_when: false

- name: Set default shell to Zsh if required
  ansible.builtin.command: chsh -s /bin/zsh {{ macos_oh_my_zsh_user }}
  become: true
  changed_when: true
  when:
    - macos_oh_my_zsh_change_default_shell | bool
    - "'/bin/zsh' not in macos_oh_my_zsh_current_user_shell.stdout"

- name: Add default python path
  ansible.builtin.lineinfile:
    backup: true
    create: true
    line: 'export PATH="/Users/{{ macos_oh_my_zsh_user }}/Library/Python/3.9/bin:$PATH:{{ ansible_env.HOME }}/.local/bin"'
    mode: '0644'
    path: "{{ macos_oh_my_zsh_user_home }}/.zshrc"
    regexp: 'export PATH=.*\.local/bin'
    state: present
...
